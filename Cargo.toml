[package]
name = "brochure"
version = "0.11.0"
edition = "2024"
rust-version = "1.95"
description = "A terminal RSS reader built with Ratatui"
license = "MIT"
authors = ["Sylviromi"]
repository = "https://github.com/Sylviromi/brochure"
readme = "README.md"
keywords = ["rss", "tui", "terminal", "reader", "atom"]
categories = ["command-line-utilities"]
exclude = ["CLAUDE.md"]

[[bin]]
name = "brochure"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
dirs = "6.0.0"
crossterm = "0.29.0"
feed-rs = "2.3.1"
html-to-markdown-rs = "3.4.0"
open = "5.3.3"
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }
# Same minor version feed-rs uses, so only one copy is compiled.
quick-xml = "0.37"
reqwest = { version = "0.13.2", default-features = false, features = ["native-tls", "gzip"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.8"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
limner = { version = "0.6.1", features = ["image-protocol", "syntax-highlighting"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# No system fonts / text shaping: ~35 fewer crates. SVG <text> is rarely used in feed images.
resvg = { version = "0.47", default-features = false }
arboard = { version = "3", default-features = false }
tui-scrollbar = "0.2.4"
tui-skeleton = "0.3"
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
dom_smoothie = "0.18.2"
# Already built for limner; renders saved-article Markdown back to HTML on export.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# `cargo binstall brochure` fetches the prebuilt binary from the GitHub release
# (built by .github/workflows/release.yml) instead of compiling. Asset names
# there must stay in sync with these URLs.
[package.metadata.binstall]
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/brochure-linux-x86_64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/brochure-linux-aarch64.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/brochure-macos-x86_64.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/brochure-macos-aarch64.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/brochure-windows-x86_64.exe"
pkg-fmt = "bin"

[features]
default = []
# OS credential store (Keychain / Credential Manager / Secret Service).
# Off by default so NetBSD/minimal and headless builds work without D-Bus.
os-keyring = ["dep:keyring"]

[profile.dev]
debug = 1

[profile.dev.package."*"]
# Dependencies are rarely debugged; skipping their debuginfo speeds up linking.
debug = false

# `cargo install` builds with this profile, so it is tuned for install time:
# thin LTO and parallel codegen compile several times faster than fat LTO with
# a single codegen unit, for a slightly larger binary.
[profile.release]
lto = "thin"
opt-level = "s" # Prioritizes small binary size.
strip = true # Ensures debug symbols are removed.

# Prebuilt release binaries (CI): smallest/fastest output, compile time irrelevant.
# Ratatui release-app recipe: https://ratatui.rs/recipes/apps/release-your-app/
[profile.dist]
inherits = "release"
codegen-units = 1
lto = true
