name: Release

# Builds release binaries for every tag push (vX.Y.Z) and attaches them to the
# GitHub release created by `scripts/release.py`. Users who don't want a
# multi-minute `cargo install` compile can download a prebuilt binary instead.
on:
  push:
    tags: ["v*"]
  # Rebuild an existing release's binaries (e.g. after fixing this workflow).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v0.11.0"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: brochure-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: brochure-linux-aarch64
          # NOTE: macos-13 runners were retired by GitHub on 2025-12-04.
          # macos-15-intel is the last hosted x86_64 macOS image, itself
          # scheduled for retirement in Aug 2027 — then migrate Intel builds
          # to arm64 runners or drop the x86_64-apple-darwin target.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: brochure-macos-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            name: brochure-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: brochure-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --profile dist --locked --target ${{ matrix.target }}

      # Every target's binary is called `brochure`, so give each a unique asset name
      # (they all land in one release). tar keeps the executable bit, which
      # artifact uploads drop.
      - name: Package
        shell: bash
        run: |
          dir=target/${{ matrix.target }}/dist
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            cp "$dir/brochure.exe" "${{ matrix.name }}"
            echo "ASSET=${{ matrix.name }}" >> "$GITHUB_ENV"
          else
            tar -czf "${{ matrix.name }}.tar.gz" -C "$dir" brochure
            echo "ASSET=${{ matrix.name }}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  publish:
    name: publish binaries
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
